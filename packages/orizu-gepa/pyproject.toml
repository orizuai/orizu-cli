[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orizu-gepa"
version = "0.0.0"
description = "Official GEPA connector for Orizu."
requires-python = ">=3.10"
# M1 imports frozen ``orizu_gepa`` directly from PYTHONPATH. Packaging that
# sibling source is deferred to M2 / ALI-1503; do not add a pip dependency.
dependencies = ["gepa==0.1.4"]

[project.scripts]
orizu-gepa-connector = "orizu_gepa_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# providers.generated.json is GENERATED — do not edit it by hand. Regenerate
# with `bun run generate:provider-registry` (ORI-2031); the TypeScript registry
# at packages/cli/src/provider-registry.ts is the source of truth and
# test/provider-registry-json-parity.test.ts fails on drift.
[tool.setuptools.package-data]
orizu_gepa_connector = ["providers.generated.json"]
