[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orizu-gepa-legacy"
version = "0.1.0"
description = "Orizu-owned text prompt optimizer with GEPA-style reflection and mandatory live logging."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
orizu-gepa = "orizu_gepa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# providers.generated.json is GENERATED — do not edit it by hand. Regenerate
# with `bun run generate:provider-registry` (ORI-2031); the TypeScript registry
# at packages/cli/src/provider-registry.ts is the source of truth and
# test/provider-registry-json-parity.test.ts fails on drift.
[tool.setuptools.package-data]
orizu_gepa = ["providers.generated.json"]
